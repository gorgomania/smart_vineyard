name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # bin/importmap загружает приложение, а с ним гем ruby-vips: без libvips он не загрузится
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  test_js:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Без npm: встроенный раннер Node (glob в --test — с Node 21)
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run JavaScript unit tests
        run: bin/test-js

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      RAILS_ENV: test
      DB_USER: rails
      DB_PASSWORD: password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: smart_vineyard_test
      DB_NAME_QUEUE: smart_vineyard_test_queue
      DB_NAME_CABLE: smart_vineyard_test_cable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libvips-tools ffmpeg

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Миграции с нуля, а не db:prepare (загрузка схемы): заодно проверяем сами миграции.
      # db:migrate проходит по всем базам, включая queue; у cable миграций нет — только схема
      - name: Set up databases
        run: |
          bin/rails db:create
          bin/rails db:migrate
          bin/rails db:schema:load:cable

      - name: Run tests
        run: bundle exec rspec
