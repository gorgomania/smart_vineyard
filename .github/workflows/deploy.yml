name: Deploy

on:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read   # список запусков CI: какой коммит main прошёл последним

# Один деплой за раз, без пересечений в helm upgrade. Очереди нет: GitHub держит один ожидающий запуск,
# и новый вытесняет прежний. Поэтому каждый запуск выкатывает не коммит своего события, а новейший
# коммит main с успешным CI (шаг «Resolve commit to deploy») — вытесненный ничего не теряет
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gorgomania/smart_vineyard

jobs:
  prepare:
    # Только успешный CI на push в main этого репозитория: CI идёт и на pull_request,
    # а фильтр branches смотрит лишь на имя ветки (PR из форка с веткой main тоже бы прошёл).
    # Ручной запуск — только с main (повторить упавший деплой), не с произвольной ветки
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      stale: ${{ steps.target.outputs.stale }}
    steps:
      - name: Resolve commit to deploy
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          # Запасной вариант, если API не ответил: коммит, чей CI запустил этот деплой
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Новейший коммит main, прошедший CI на push: не обязательно коммит этого события
          # (тот мог устареть, пока запуск ждал своей очереди) и никогда — коммит с упавшим CI
          SHA=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty') || SHA=""
          SHA=${SHA:-$EVENT_SHA}
          if [ -z "$SHA" ]; then
            echo "::error::No commit on main with successful CI"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          stale=false
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Сравниваем с тем, что реально стоит на проде (workflow сериализован через concurrency).
            # Так прошедший CI коммит выкатится, даже если следующий за ним упал,
            # а поздно закончившийся CI старого коммита не откатит прод назад.
            # Берём ревизию со статусом deployed: у последней, упавшей по таймауту, тег новый,
            # а на проде старые поды — по нему повторный деплой ошибочно счёлся бы лишним
            key=$(mktemp) && printf '%s\n' "$SSH_KEY" > "$key"
            remote() { ssh -i "$key" -o StrictHostKeyChecking=accept-new "ubuntu@$SSH_HOST" "$1"; }
            rev=$(remote 'helm history smart-vineyard -n smart-vineyard -o json' \
              | jq -r '[.[] | select(.status == "deployed")] | last | .revision // empty') || rev=""
            deployed=""
            if [ -n "$rev" ]; then
              deployed=$(remote "helm get values smart-vineyard -n smart-vineyard --revision $rev -o json" \
                | jq -r '.image.tag // empty') || deployed=""
            fi
            rm -f "$key"

            if [ -n "$deployed" ] && [ "$deployed" != "latest" ]; then
              # status относительно задеплоенного: ahead — новее, behind/identical — не новее, diverged — после force push
              status=$(gh api "repos/${{ github.repository }}/compare/$deployed...$SHA" --jq .status) || status=unknown
              if [ "$status" = "behind" ] || [ "$status" = "identical" ]; then
                stale=true
                echo "::notice::Skip deploy of $SHA: production already runs $deployed ($status)"
              fi
            fi
          fi
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.stale != 'true'
    # Native arm64 runner: the Oracle Ampere A1 server is arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          # latest ставит deploy после успешного helm upgrade
          tags: ${{ env.IMAGE }}:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [ prepare, build ]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Copy Helm chart to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          source: chart
          target: /home/ubuntu/deploy
          rm: true

      - name: helm upgrade
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            helm upgrade --install smart-vineyard /home/ubuntu/deploy/chart \
              --namespace smart-vineyard \
              --set image.tag=${{ needs.prepare.outputs.sha }} \
              --wait --timeout 10m

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest = то, что сейчас работает на проде (без пересборки, только новый тег на тот же манифест)
      - name: Tag deployed image as latest
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${{ needs.prepare.outputs.sha }}"
