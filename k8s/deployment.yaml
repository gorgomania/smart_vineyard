apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-vineyard
  namespace: smart-vineyard
  labels:
    app.kubernetes.io/name: smart-vineyard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-vineyard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-vineyard
    spec:
      imagePullSecrets:
        - name: gitlab-registry-pull
      containers:
        - name: smart-vineyard
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: RAILS_ENV
              value: "production"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: RAILS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: rails-master-key
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
