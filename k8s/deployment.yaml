apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-vineyard
  namespace: smart-vineyard
  labels:
    app.kubernetes.io/name: smart-vineyard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-vineyard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-vineyard
    spec:
      imagePullSecrets:
        - name: gitlab-registry-pull
      containers:
        - name: smart-vineyard
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: RAILS_ENV
              value: "production"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: secret-key-base
            - name: APP_HOST
              value: "smartvineyard.24hlp.ru"
            - name: SMTP_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: smtp-address
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: smtp-port
            - name: SMTP_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: smtp-domain
            - name: SMTP_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: smtp-user-name
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: smtp-password
            - name: MAILER_SENDER
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: mailer-sender
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
