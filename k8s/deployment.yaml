apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smart-vineyard-storage
  namespace: smart-vineyard
  labels:
    app.kubernetes.io/name: smart-vineyard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-vineyard
  namespace: smart-vineyard
  labels:
    app.kubernetes.io/name: smart-vineyard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-vineyard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-vineyard
    spec:
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: gitlab-registry-pull
      containers:
        - name: smart-vineyard
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: active-storage
              mountPath: /rails/storage
          env:
            - name: RAILS_ENV
              value: "production"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: db-password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: secret-key-base
            - name: APP_HOST
              value: "smartvineyard.24hlp.ru"
            - name: SMTP_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: smtp-address
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: smtp-port
            - name: SMTP_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: smtp-domain
            - name: SMTP_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: smtp-user-name
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: smtp-password
            - name: MAILER_SENDER
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: mailer-sender
            - name: YANDEX_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-vineyard-secrets
                  key: yandex-maps-api-key
                  optional: true
            - name: REDIS_URL
              value: "redis://redis:6379/1"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: active-storage
          persistentVolumeClaim:
            claimName: smart-vineyard-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: smart-vineyard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: smart-vineyard
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379