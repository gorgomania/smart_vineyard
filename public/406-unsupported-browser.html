<!doctype html>
<html lang="ru">
  <head>
    <title>Браузер устарел — Smart Vineyard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.png" type="image/png">
    <style>
      /* Статическая страница без Tailwind (отдаётся и когда приложение упало):
         цвета повторяют палитру из app/assets/tailwind/application.css. Страницы ошибок одинаковые, кроме текста */
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: #f2f2f2;
        color: #333;
        font-family: "PT Sans", Arial, Helvetica, sans-serif;
        line-height: 1.4;
      }
      main {
        width: 100%;
        max-width: 400px;
        padding: 32px 20px;
        border-radius: 16px;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
      }
      .logo { height: 50px; width: auto; }
      .code { font-size: 64px; font-weight: 700; line-height: 1; color: #78347f; }
      h1 { font-size: 22px; }
      p { color: #4e4e4e; }
      .button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 280px;
        height: 64px;
        margin-top: 4px;
        border-radius: 8px;
        background: linear-gradient(to bottom, #78347f, #9a55a2);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <!-- public/406-unsupported-browser.html -->
    <main>
      <img class="logo" src="/logo.png" alt="Smart Vineyard">
      <div class="code">406</div>
      <h1>Браузер устарел</h1>
      <p>Smart Vineyard работает в современных браузерах. Обновите браузер или откройте сайт в другом.</p>
    </main>
  </body>
</html>
