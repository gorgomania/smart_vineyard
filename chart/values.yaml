host: smartvineyard.duckdns.org

image:
  repository: ghcr.io/gorgomania/smart_vineyard
  tag: latest            # CI passes --set image.tag=<commit sha>
  pullPolicy: IfNotPresent
imagePullSecrets: []     # e.g. [{name: ghcr-pull}] if the package is private

# Created by hand once: kubectl -n smart-vineyard create secret generic smart-vineyard-secrets ...
existingSecret: smart-vineyard-secrets

ingress:
  className: traefik
  clusterIssuer: letsencrypt-prod
  httpsRedirect: true

# Встроенный traefik k3s (HelmChartConfig в kube-system, chart/templates/traefik-config.yaml)
traefik:
  manage: true              # false — не трогать traefik кластера
  preserveClientIp: true    # externalTrafficPolicy: Local — реальный IP клиента в Rails вместо 10.42.0.1
  requestTimeout: 3600s     # чтение/отдача тела запроса на entrypoints web и websecure (v3 по умолчанию 60s)

# Загрузка и отдача больших файлов (до 1 ГБ) идут через Thruster в web-поде:
# по умолчанию он рвёт запрос, если тело не пришло за 30 с (→ 502 на «Error storing»)
uploadTimeoutSeconds: 3600  # HTTP_READ_TIMEOUT и HTTP_WRITE_TIMEOUT Thruster; 1 ГБ при 3 Мбит/с ≈ 45 мин

logLevel: info            # RAILS_LOG_LEVEL: debug | info | warn | error

web:
  threads: 3              # RAILS_MAX_THREADS — потоки Puma
  dbPool: 10              # DB_POOL — потоки Puma + Action Cable (worker_pool_size 4) + запас
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 4Gi }

worker:
  concurrency: 3          # JOB_CONCURRENCY — процессы solid_queue: на 4 ядрах 3 под задачи, 1 под web и Postgres
  threads: 5              # JOB_THREADS — потоков на процесс; больше не нужно: процессорная работа упирается в GVL
  dbPool: 10              # DB_POOL и QUEUE_DB_POOL на процесс: потоки задач + служебные
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "3", memory: 4Gi }   # 3 процесса по ~0.5–1 ГБ при декодировании больших фото

storage:
  size: 50Gi             # ActiveStorage uploads (photos, videos)

postgres:
  image: imresamu/postgis:16-3.5   # postgis/postgis has no arm64 build
  size: 20Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 2Gi }
