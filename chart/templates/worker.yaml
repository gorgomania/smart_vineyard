apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "sv.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  # Новый worker берёт задачи, пока старый доделывает начатые
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "sv.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      # Запас поверх JOB_SHUTDOWN_TIMEOUT, чтобы solid_queue сам снял недоделанные задачи, а не получил SIGKILL
      terminationGracePeriodSeconds: {{ add .Values.worker.shutdownTimeoutSeconds 30 }}
      securityContext:
        fsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "sv.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bin/jobs"]
          env:
            {{- include "sv.appEnv" . | nindent 12 }}
            - name: JOB_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: JOB_THREADS
              value: {{ .Values.worker.threads | quote }}
            # Пул на процесс: потоки задач (JOB_THREADS) + служебные потоки solid_queue
            - name: DB_POOL
              value: {{ .Values.worker.dbPool | quote }}
            - name: QUEUE_DB_POOL
              value: {{ .Values.worker.dbPool | quote }}
            - name: JOB_SHUTDOWN_TIMEOUT
              value: {{ .Values.worker.shutdownTimeoutSeconds | quote }}
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-storage
