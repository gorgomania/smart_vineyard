apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "sv.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "sv.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "sv.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bin/jobs"]
          env:
            {{- include "sv.appEnv" . | nindent 12 }}
            - name: JOB_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            # Пул на процесс: 20 потоков задач (config/queue.yml) + служебные потоки solid_queue
            - name: DB_POOL
              value: {{ .Values.worker.dbPool | quote }}
            - name: QUEUE_DB_POOL
              value: {{ .Values.worker.dbPool | quote }}
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-storage
