apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-storage
  labels:
    {{- include "sv.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # never delete uploaded files on helm uninstall
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storage.size }}
