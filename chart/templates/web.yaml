apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "sv.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  # Новый под поднимается рядом со старым, старый гасится только когда новый готов. RWO не мешает:
  # local-path привязывает том к узлу, а не к поду (его и так одновременно монтирует worker)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "sv.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      # SIGTERM Puma дожидается текущих запросов, а Thruster проксирует, пока жива Puma:
      # начатая загрузка до 1 ГБ успевает дойти, сколько бы она ни шла в пределах таймаута
      terminationGracePeriodSeconds: {{ add .Values.web.drainDelaySeconds .Values.uploadTimeoutSeconds 30 }}
      securityContext:
        fsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "sv.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            {{- include "sv.appEnv" . | nindent 12 }}
            # Только для web: в worker RAILS_MAX_THREADS урезал бы DB_POOL (он берётся из него по умолчанию)
            - name: RAILS_MAX_THREADS
              value: {{ .Values.web.threads | quote }}
            - name: DB_POOL
              value: {{ .Values.web.dbPool | quote }}
            # Thruster: по умолчанию 30 с на приём тела запроса и на отдачу ответа — мало для файлов до 1 ГБ
            - name: HTTP_READ_TIMEOUT
              value: {{ .Values.uploadTimeoutSeconds | quote }}
            - name: HTTP_WRITE_TIMEOUT
              value: {{ .Values.uploadTimeoutSeconds | quote }}
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          readinessProbe:
            httpGet: { path: /up, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /up, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          # После SIGTERM Puma не принимает новые запросы (Thruster отвечает 502), поэтому сначала
          # ждём, пока traefik уберёт под из балансировки и пустит новые запросы на новый под
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.web.drainDelaySeconds }}"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-storage
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "sv.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
