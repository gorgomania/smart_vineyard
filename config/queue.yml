default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [default, low_priority]
      threads: 20
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
  recurring:
    cleanup_orphaned_storage:
      class: CleanupOrphanedActiveStorageRecordsJob
      schedule: every day at 3am

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
