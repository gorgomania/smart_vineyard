default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Тяжёлые задачи (распаковка, ONNX, vips, ffmpeg) упираются в процессор, а потоки одного процесса — в GVL:
    # параллельность дают процессы (JOB_CONCURRENCY). Один поток ещё и раздаёт задачи поровну: процесс забирает
    # столько задач, сколько у него свободных потоков, и при 5 потоках два архива уходили в один процесс
    # и шли по очереди, пока остальные простаивали
    - queues: [heavy]
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Мелочь (запросы к БД, рассылки, удаление файлов) почти не считает, а ждёт: потоки ей подходят.
    # Отдельный процесс, чтобы она не стояла за тяжёлыми задачами, когда те заняли все процессы
    - queues: [default, low_priority]
      threads: <%= ENV.fetch("JOB_THREADS", 5) %>
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
