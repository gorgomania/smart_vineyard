default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Работа задач в основном процессорная (vips, ONNX), а потоки одного процесса упираются в GVL:
    # параллельность дают процессы (JOB_CONCURRENCY), а не потоки
    - queues: [default, low_priority]
      threads: <%= ENV.fetch("JOB_THREADS", 5) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
