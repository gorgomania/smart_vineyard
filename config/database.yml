default: &default
  adapter: postgis
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS") { 25 } } %>
  username: <%= ENV["DB_USER"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV["DB_PORT"] %>

development:
  primary:
    <<: *default
    database: smart_vineyard_development
  queue:
    <<: *default
    database: smart_vineyard_development_queue
    migrations_paths: db/queue_migrate
    pool: <%= ENV.fetch("QUEUE_DB_POOL") { 25 } %>
  cable:
    <<: *default
    database: smart_vineyard_development_cable
    migrations_paths: db/cable_migrate

test:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "smart_vineyard_test") %>
    template: template0
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_QUEUE", "smart_vineyard_test_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CABLE", "smart_vineyard_test_cable") %>
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "smart_vineyard_production") %>
    username: <%= ENV.fetch("DB_USER", "rails") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_QUEUE", "smart_vineyard_production_queue") %>
    username: <%= ENV.fetch("DB_USER", "rails") %>
    migrations_paths: db/queue_migrate
    pool: <%= ENV.fetch("QUEUE_DB_POOL") { 25 } %>
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CABLE", "smart_vineyard_production_cable") %>
    username: <%= ENV.fetch("DB_USER", "rails") %>
    migrations_paths: db/cable_migrate
